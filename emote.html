<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send an emoji to the lightstick</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='54'%3E%F0%9F%92%9E%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="touchicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='54'%3E%F0%9F%92%9E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
<style>
:root{--sil:#dfe6ee;--ink:#14123a;--cy:#00e5ff;--mg:#ff2bd6;--lime:#b6ff3b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:16px;font:14px/1.4 Tahoma,Verdana,sans-serif;color:var(--ink);
background:
radial-gradient(circle,#fff 0 1px,transparent 1.5px) 0 0/90px 90px,
radial-gradient(circle,#9ff 0 1px,transparent 1.5px) 40px 55px/130px 130px,
radial-gradient(circle at 15% 10%,#7a5cff,transparent 45%),
radial-gradient(circle at 90% 85%,#ff2bd6,transparent 50%),
linear-gradient(160deg,#1a0f5e,#0a4a8f 60%,#0d1b4d) fixed}
.win{max-width:540px;margin:24px auto 0;background:var(--sil);border:2px solid #fff;border-right-color:#6b7685;border-bottom-color:#6b7685;
box-shadow:0 0 0 2px #0a0a2a,8px 8px 0 rgba(0,0,0,.35),0 0 44px rgba(0,229,255,.5)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;color:#fff;
font:900 13px Orbitron,Tahoma,sans-serif;letter-spacing:1px;background:linear-gradient(90deg,#1b2cff,#00c8ff 70%,#b6ff3b)}
.bar b{display:inline-block;width:18px;height:18px;line-height:15px;text-align:center;color:var(--ink);
background:linear-gradient(#fff,#b9c4d2);border:2px solid #fff;border-right-color:#6b7685;border-bottom-color:#6b7685;font:700 12px Tahoma}
.body{padding:14px}
h1{margin:0 0 12px;font:900 26px Orbitron,Tahoma,sans-serif;
background:linear-gradient(#fff 0,#7fe9ff 45%,#ff2bd6 55%,#7a1d9e);-webkit-background-clip:text;background-clip:text;color:transparent;
-webkit-text-stroke:1px #14123a;filter:drop-shadow(2px 2px 0 rgba(20,18,58,.5))}
.bevel{cursor:pointer;background:linear-gradient(#fff,#c9d3df);border:2px solid #fff;border-right-color:#6b7685;border-bottom-color:#6b7685}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;margin-bottom:8px;font-weight:700}
.pager button{width:36px;height:30px;font:700 18px/1 Tahoma,sans-serif;color:var(--ink)}
.pager button:active{border-color:#6b7685 #fff #fff #6b7685}
.inset{background:#fff;border:2px solid #6b7685;border-right-color:#fff;border-bottom-color:#fff;padding:8px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.grid button{font:24px/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;padding:5px 0}
.grid button:hover{background:linear-gradient(#e9fdff,#8fe9ff)}
.grid button[aria-pressed=true]{border-color:#6b7685 #fff #fff #6b7685;background:#9ff6ff}
.stage{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;margin:14px 0;text-align:center}
canvas{width:100%;max-width:240px;aspect-ratio:1;image-rendering:pixelated;background:#000;border:2px solid #6b7685;border-right-color:#fff;border-bottom-color:#fff}
.stage p{margin:0;text-align:center;font-size:12px}
#beam{display:block;width:100%;padding:14px;cursor:pointer;color:#fff;text-shadow:0 1px 2px #004a80;
font:900 20px Orbitron,Tahoma,sans-serif;letter-spacing:2px;border-radius:999px;border:2px solid #005a99;
background:linear-gradient(#a8f7ff,#18bbff 50%,#0086d9 51%,#3fe0ff);
box-shadow:inset 0 2px 0 rgba(255,255,255,.85),0 4px 14px rgba(0,150,255,.7)}
#beam:disabled{filter:grayscale(1);cursor:not-allowed}
#beam:active:not(:disabled){transform:translateY(2px)}
.status{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px}
.led{flex:none;width:12px;height:12px;border-radius:50%;background:#e33;box-shadow:0 0 6px #e33}
.led.on{background:#2f2;box-shadow:0 0 8px #2f2}
:focus-visible{outline:3px dashed var(--mg);outline-offset:2px}
@media (max-width:420px){.grid{grid-template-columns:repeat(6,1fr)}.stage{flex-direction:column}}
</style>
</head>
<body>
<main class="win">
  <div class="bar"><span>emote.exe</span><b aria-hidden="true">x</b></div>
  <div class="body">
    <h1>Send an emoji to the lightstick:</h1>
    <div class="inset"><div class="grid" id="grid"></div></div>
    <div class="pager">
      <button id="prev" class="bevel" type="button" aria-label="Previous page">‹</button>
      <span id="pnum" aria-live="polite"></span>
      <button id="next" class="bevel" type="button" aria-label="Next page">›</button>
    </div>
    <div class="stage">
      <canvas id="preview" width="320" height="320" aria-label="LED preview of the chosen emoji"></canvas>
      <p id="hint">LED lightstick preview — select an emoji above.</p>
    </div>
    <button id="beam" disabled>BEAM IT!</button>
    <div class="status"><span class="led" id="led"></span><span id="status">Connecting…</span></div>
  </div>
</main>
<script>
// Use the same TOPIC string in the ESP32 sketch (MQTT_TOPIC)
const TOPIC = 'CHANGE-ME-8f3k2xq/emoji';
const STATUS_TOPIC = TOPIC + '/status';
const PING_TOPIC = TOPIC + '/ping';   // page asks "are you there?", stick answers at once
const HEARTBEAT_TIMEOUT_MS = 25000;   // stick sends a heartbeat every 10 s
const COLS = 40, ROWS = 40, COOLDOWN_MS = 5000;

const PAGES = [
  '😀 😎 🤠 😍 🤪 😜 🥰 😇 🤩 😴 😭 😡 🥺 💩 🤡 👻 💀 👽 👾 🤖 😈 🙈 🙉 🙊 😂 🤣 😊 🙂 🙃 😉 😋 😛 😝 🫠 🫨 🥹 😍 😘 😗 😚 😙 😌 😔 😪 😷 🤒 🤕 🤑 😤',
  '🐱 🐶 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐸 🐵 🐧 🐤 🦄 🐝 🦋 🐢 🐙 🐬 🐳 🦖 🐞 🐌 🦉 🐺 🐮 🐷 🐭 🐹 🐻‍❄️ 🦓 🦒 🐘 🦏 🦛 🐊 🐍 🦎 🦀 🦞 🦐 🦑 🐠 🐟 🦈 🦭 🦦 🦥',
  '🍕 🍔 🍟 🌭 🍩 🍪 🎂 🍰 🍦 🍭 🍫 🍓 🍒 🍉 🍑 🍆 🍌 🍍 🥑 🍎 🍿 🍣 🍜 🥐 🍋 🍇 🍊 🍐 🥝 🫐 🥥 🍅 🥕 🌽 🥦 🥒 🥨 🧀 🥞 🧇 🥓 🍳 🥪 🌮 🌯 🍝 🍚 🧁',
  '💖 💗 💓 💕 💘 💝 ❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🧿 ✨ ⭐ 🌟 💫 🔮 🎀 💋 💎 👑 🌈 🩷 🩵 🩶 🤎 💔 ❤️‍🔥 ❣️ 💞 💌 🫶 💐 🌹 🪷 🌼 🏵️ 🎊 🎉 🪩 💿 🎁 🧸 🏳️‍🌈 ‼',
  '🌙 ☀️ 🪐 🚀 🛸 🌍 ☁️ ⚡ 🔥 ❄️ 🌊 🌸 🌺 🌻 🌷 🌴 🍀 🍄 🌵 🌋 ⛄ 🍁 💰 💸 🌎 🌏 🌕 🌑 🌞 🌝 🌛 🌜 🌤️ ⛅ 🌧️ ⛈️ 🌪️ 🌫️ 🌬️ 🌈 🪢 ☂️ 🌱 🌿 🌲 🌳 🍂 🍃',
].map(s => [...new Set(s.split(' '))].slice(0, 48));

const $ = id => document.getElementById(id);
const grid = $('grid'), beam = $('beam');
const work = document.createElement('canvas'); work.width = COLS; work.height = ROWS;
const wctx = work.getContext('2d', {willReadFrequently: true});
const big = document.createElement('canvas'); big.width = big.height = 256;
const bctx = big.getContext('2d', {willReadFrequently: true});
const pctx = $('preview').getContext('2d');
let page = 0, chosen = '', nextAllowed = 0, online = false, stickOnline = false, lastHeartbeat = 0, checkingUntil = 0, everConnected = false, rgbOut = null;

// 💞 favicon as a PNG too, since Safari and iOS ignore SVG icons
(function () {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const x = c.getContext('2d');
  x.font = '140px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('💞', 90, 98);
  const png = c.toDataURL('image/png');
  $('favicon').type = 'image/png'; $('favicon').href = png;
  $('touchicon').href = png;
})();

function showPage(n) {
  page = (n + PAGES.length) % PAGES.length;
  $('pnum').textContent = (page + 1) + ' / ' + PAGES.length;
  grid.textContent = '';
  PAGES[page].forEach(e => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'bevel'; b.textContent = e;
    b.setAttribute('aria-label', 'Emoji ' + e);
    b.setAttribute('aria-pressed', String(e === chosen));
    b.onclick = () => choose(e);
    grid.appendChild(b);
  });
}
$('prev').onclick = () => showPage(page - 1);
$('next').onclick = () => showPage(page + 1);

// Draw the emoji with the device's emoji font, crop to its visible edges,
// and stretch it over the whole LED grid.
function choose(e) {
  chosen = e;
  [...grid.children].forEach(b => b.setAttribute('aria-pressed', String(b.textContent === e)));
  bctx.clearRect(0, 0, 256, 256);
  bctx.font = '180px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  bctx.textAlign = 'center'; bctx.textBaseline = 'middle';
  bctx.fillText(e, 128, 135);
  const bd = bctx.getImageData(0, 0, 256, 256).data;
  let x0 = 256, y0 = 256, x1 = -1, y1 = -1;
  for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++)
    if (bd[(y * 256 + x) * 4 + 3] > 24) {
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  if (x1 < 0) { x0 = 0; y0 = 0; x1 = 255; y1 = 255; }
  wctx.fillStyle = '#000'; wctx.fillRect(0, 0, COLS, ROWS);
  wctx.imageSmoothingEnabled = true; wctx.imageSmoothingQuality = 'high';
  wctx.drawImage(big, x0, y0, x1 - x0 + 1, y1 - y0 + 1, 0, 0, COLS, ROWS);
  const d = wctx.getImageData(0, 0, COLS, ROWS).data;
  rgbOut = new Uint8Array(COLS * ROWS * 3);       // column-major, gamma-corrected for LEDs
  pctx.fillStyle = '#000'; pctx.fillRect(0, 0, 320, 320);
  const cell = 320 / COLS;
  for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) {
    const i = (y * COLS + x) * 4, o = (x * ROWS + y) * 3;
    for (let k = 0; k < 3; k++) rgbOut[o + k] = Math.round(255 * (d[i + k] / 255) ** 2.2);
    pctx.fillStyle = `rgb(${d[i]},${d[i + 1]},${d[i + 2]})`;
    pctx.beginPath(); pctx.arc((x + .5) * cell, (y + .5) * cell, cell * .42, 0, 6.2832); pctx.fill();
  }
  $('hint').textContent = 'Lightstick preview — selected: ' + e;
  refresh();
}

// MQTT connection is separate from the ESP32 lightstick's presence.
const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {reconnectPeriod: 3000});
function updateConnectionStatus() {
  const alive = online && stickOnline && Date.now() - lastHeartbeat < HEARTBEAT_TIMEOUT_MS;
  const checking = online && !alive && Date.now() < checkingUntil;
  setStatus(alive, !online ? (everConnected ? 'Server offline, reconnecting…' : 'Connecting…')
                  : alive ? 'Lightstick connected'
                  : checking ? 'Checking lightstick…' : 'Lightstick disconnected');
  refresh();
}
client.on('connect', () => {
  online = true; everConnected = true;
  stickOnline = false;
  lastHeartbeat = 0;
  checkingUntil = Date.now() + 5000;      // no "disconnected" flash while we ask the stick
  client.subscribe(STATUS_TOPIC, {qos: 1}, err => {
    if (err) { console.error('Could not subscribe to lightstick status', err); return; }
    client.publish(PING_TOPIC, 'ping');                       // stick replies right away
    setTimeout(() => { if (client.connected && !stickOnline) client.publish(PING_TOPIC, 'ping'); }, 2000);
  });
  updateConnectionStatus();
});
client.on('message', (topic, payload, packet) => {
  if (topic !== STATUS_TOPIC) return;
  const state = payload.toString();
  if (state === 'online') {
    // A retained "online" is just the broker's saved copy and may be stale
    // (stick unplugged). Only a live reply or heartbeat proves it is alive now.
    if (packet && packet.retain) return;
    stickOnline = true; lastHeartbeat = Date.now();
  } else {
    if (packet && packet.retain) return;      // old saved "offline": wait for the ping reply
    stickOnline = false; lastHeartbeat = 0; checkingUntil = 0;   // live "offline" (last will)
  }
  updateConnectionStatus();
});
client.on('close', () => { online = false; stickOnline = false; lastHeartbeat = 0; updateConnectionStatus(); });
client.on('error', err => console.error('MQTT error:', err));
setInterval(updateConnectionStatus, 1000);
function setStatus(on, msg) { $('led').classList.toggle('on', on); $('status').textContent = msg; }

function refresh() {
  const wait = nextAllowed - Date.now();
  beam.disabled = !online || !stickOnline || Date.now() - lastHeartbeat >= HEARTBEAT_TIMEOUT_MS || !chosen || wait > 0;
  beam.textContent = wait > 0 ? 'WAIT ' + Math.ceil(wait / 1000) + 's' : 'BEAM IT!';
  if (wait > 0) setTimeout(refresh, 250);
}
beam.onclick = () => {
  if (beam.disabled) return;
  const msg = new Uint8Array(2 + rgbOut.length);
  msg[0] = COLS; msg[1] = ROWS; msg.set(rgbOut, 2);
  client.publish(TOPIC, msg, {retain: true, qos: 1}, err => {
    if (err) setStatus(false, 'Send failed, try again');
  });
  nextAllowed = Date.now() + COOLDOWN_MS; refresh();
};
showPage(0);
</script>
</body>
</html>
